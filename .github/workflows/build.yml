name: Build

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore Hawkstore.csproj
      - run: dotnet build Hawkstore.csproj -c Release --no-restore
      - run: dotnet publish Hawkstore.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -p:DebugType=None -o artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: Hawkstore-win-x64
          path: artifacts/Hawkstore.exe
